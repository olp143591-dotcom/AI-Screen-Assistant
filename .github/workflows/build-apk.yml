
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q AI-Screen-Assistant-GitHub-Project.zip -d project
          find project -name settings.gradle -print

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Screen-Assistant-APK
          path: project/app/build/outputs/apk/debug/*.apk
          
